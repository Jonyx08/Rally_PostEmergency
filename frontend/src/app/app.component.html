<div class="app-container">
  <!-- ENCABEZADO CON SELECTOR DE ROL, CONECTIVIDAD, TEMA Y PESTAÑAS -->
  <app-header
    [activeTab]="tabActiva()"
    [theme]="tema()"
    (tabChange)="setTab($event)"
    (toggleTheme)="toggleTema()"
  />

  <!-- BANNER DE FEEDBACK TEMPORAL / RESULTADO -->
  @if (feedbackMensaje(); as fb) {
    <app-feedback-banner
      [data]="fb"
      (close)="cerrarFeedback()"
    />
  }

  <!-- CONTENIDO PRINCIPAL SEGÚN PESTAÑA Y ROL -->
  <main class="app-main">
    @if (tabActiva() === 'nuevo') {
      <app-formulario-emergencia
        (reportSubmitted)="onReportSubmitted($event)"
      />
    } @else if (tabActiva() === 'cola') {
      <app-cola-reportes
        (actionFeedback)="onActionFeedback($event)"
      />
    } @else if (reporteService.modo() === 'RECOLECTOR' && tabActiva() === 'mula') {
      <app-mula-datos
        (actionFeedback)="onActionFeedback($event)"
      />
    } @else if (reporteService.modo() === 'RECOLECTOR' && tabActiva() === 'coe') {
      <app-enlace-coe
        (actionFeedback)="onActionFeedback($event)"
      />
    }
  </main>
</div>

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: triaje-db
    environment:
      POSTGRES_USER: triaje
      POSTGRES_PASSWORD: triaje
      POSTGRES_DB: triaje
    ports:
      - "5432:5432"
    volumes:
      - triaje-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triaje -d triaje"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  triaje-data:
